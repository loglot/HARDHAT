<body>
<style>
    @font-face {
        font-family: "pix";
        src: url("./PixelarRegular.woff") format('woff');
    }
    @font-face {
        font-family: "pixmono";
        src: url("./DepartureMono-Regular.woff") format('woff');
    }
    body {
        background-color:#150d20;
        color:hsl(262, 24%, 80%);
        font-family:pix;
    }
    :root{

        scrollbar-color: #c8bfd8 #0e0718;
    }
    .textin {
        background-color:#2a203a;
        color:#c8bfd8;
        border-style: solid;
        border-color: #322747;
        outline:none;
        border-radius: 5px;
        max-width: 400px;
        width:100%;
        font-family:pix;
    }
    button{
        background-color:#2a203a;
        color:#c8bfd8;
        border-style: solid;
        border-color: #322747;
        font-family:pix;
        border-radius: 5px;
        /* outline:none; */
        font-size:large;
        outline:none;

    }
    button:active{
        background-color:#1d142b;
        border-color:#160f22;

    }
    .active{
        background-color:#3e2e58;
        border-color: #574576;

    }
    .final{
        display:none;

    }
    select{
        background-color:#2a203a;
        color:#c8bfd8;
        font-family:pix;
        border-style: solid;
        border-color: #322747;
        border-radius: 5px;
        outline:none;

    }
    p{
        white-space: pre-line; 
    }
    .hidden{
        display:none;
    }
    .warn{
        color:#e1aaaa;
    }
    .error{
        color:#ff0000;
    }
    .log{
        background-color: #0e0718;
        font-family: pixmono;
        font-size: small;
        white-space: pre;
        overflow:auto;
        height:500px;
        width:100%;
        overflow-x: hidden;
        scrollbar-color: #c8bfd8 #0e0718;
    }
    #curl{
        overflow:auto;
        height:80px;
        width:100%;
        overflow-x: hidden;
        /* max-width: 600px; */
    }
    .nav{
        height:40px
    }
    .mod{
        width:300px;
        height:350px;
        background-color: #0e0718;
        margin:10px;
        padding:5px;
        border-style: solid;
        border-color: #1d152d;
        border-radius: 5px;
    }
    .modimg{
        width:100%;
        height:50%;
        object-fit: cover;
    }
    .flex{

        display: flex;
        flex-wrap: wrap;
    justify-content: center;
    }
</style>
<h1 id="h">HARDHAT</h1>
<h3>The HAT Installer</h3>
<div>
    <h1 id="status">idle</h1>
    <button id="logs">show logs</button>
    <p id="log" class="log hidden">[empty]</p>
    <br><br><br><br>
</div>
<div class="nav">
    <button id="installation" class="active">installation</button>
    <button id="mods">mods</button>
    <button id="launch">launch</button>
</div>
<div class = "installer" id="pagein">
    <label for="FEZ PATH">FEZ Game Path:<br></label>
    <input class="textin" id="path" type="text" name="FEZ PATH" value="Auto Detect">

        <select id="versions">
            <option value="/new">Latest</option>
        </select>
        <div id="depricated" class="hidden">
            <h2 class="warn">WARNING: Pre 2.0 builds are Depricated</h2>
            <p class="warn"> some mods don't support newer builds, but depricated builds are experimental in this installer</p>
            <!-- <label for="sos">SteamOS: </label>
            <input type="checkbox" name="sos" value=false>       -->
        </div>

        <div id="unsupported" class="hidden">
            <h2 class="error">PRE 2.0 BUILDS UNSUPPORTED CURRENTLY</h2>
        </div><br><br>
    <button id="exec" class="final hidden">Install!</button>

</div>
<div class = "launcher hidden" id="pagela">
    <button id="FEZ">FEZ</button>
    <button id="HAT">HAT</button>
</div>
<div class = "mods hidden" id="pagemo">
    <h1 class="warn">mod installation coming later</h1>
    <div class="flex" id="modflex">

    </div>
</div>

<!-- <p id="curl" class="log">curl log:</p> -->
</body>
<script src="./handle.js" type="module"></script><br>
