<body>
<style>
    @font-face {
        font-family: "pix";
        src: url("./PixelarRegular.woff") format('woff');
    }
    @font-face {
        font-family: "pixmono";
        src: url("./DepartureMono-Regular.woff") format('woff');
    }
    body {
        background-color:#150d20;
        color:hsl(262, 24%, 80%);
        font-family:pix;
        user-select: none;
    }
    :root{

        scrollbar-color: #c8bfd8 #0e0718;
    }
    input {
        background-color:#2a203a;
        color:#c8bfd8;
        border-style: solid;
        border-color: #322747;
        outline:none;
        border-radius: 5px;
        max-width: 400px;
        width:100%;
        font-family:pix;
        user-select: text;
    }input:hover{
        background-color:rgb(36, 25, 53);
        border-color: #3b2f52;

    }
    button{
        background-color:#2a203a;
        color:#c8bfd8;
        border-style: solid;
        border-color: #322747;
        font-family:pix;
        border-radius: 5px;
        /* outline:none; */
        font-size:large;
        outline:none;
        user-select: none;
        cursor: pointer;

    }
    button:hover{
        background-color:rgb(36, 25, 53);
        border-color: #3b2f52;

    }
    button:active{
        background-color:#1d142b;
        border-color: #322747;

    }
    .active{
        background-color:#3e2e58;
        border-color: #574576;

    }
    .final{
        display:none;

    }
    select{
        background-color:#2a203a;
        color:#c8bfd8;
        font-family:pix;
        border-style: solid;
        border-color: #322747;
        border-radius: 5px;
        outline:none;
        user-select: none;
        cursor: pointer;

    }select:hover{
        background-color:rgb(36, 25, 53);
        border-color: #3b2f52;

    }
    p, h1, h2, h3, h4{
        white-space: pre-line; 
        user-select: text;
    }
    header h3, footer p{
        user-select: none;
        color:#635a74;
    }
    .mod p, .mod h2{
        user-select: none;

    }
    .hidden{
        display:none;
    }
    .warn{
        color:#e1aaaa;
    }
    .error{
        color:#ff0000;
    }
    .log{
        background-color: #0e0718;
        font-family: pixmono;
        font-size: small;
        white-space: pre;
        overflow:auto;
        height:500px;
        width:100%;
        overflow-x: hidden;
        scrollbar-color: #c8bfd8 #0e0718;
    }
    #curl{
        overflow:auto;
        height:80px;
        width:100%;
        overflow-x: hidden;
        /* max-width: 600px; */
    }
    .nav{
        height:40px
    }
    .mod{
        width:300px;
        height:350px;
        background-color: #0e0718;
        margin:10px;
        padding:5px;
        border-style: solid;
        border-color: #1d152d;
        border-radius: 5px;
        text-align: center;
    }
    .modimg{
        width:100%;
        height:50%;
        object-fit: cover;
    }
    .flex{

        display: flex;
    }
    .wrap{
        flex-wrap: wrap;
    justify-content: center;

    }
    .file{
        width:100%-10px;
        background-color: #0e0718;
        margin:5px;
        padding:5px;
	align-items:center;
        justify-content:space-between;
    }
    .space{

        justify-content:space-between;
    }
    .title{
        height:25px
    }

    footer{
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background-color: #090411;
        text-align: center;
        user-select: none;
    }
    a{
        color:#7d60ff
    }
    a:hover{
        color:#4d3f88

    }
    .rest{
        height:100%
    }
    header{
        text-align: center;
        margin:0;
        position: fixed;
        background-color: #090411;
        left: 0;
        top: 0;
        width: 100%;
        padding-top: 20px;
        height:80px;
        z-index: 10;
        user-select: none;
    }
    body{
        padding-top: 100px;
    }
    .nav{
        text-align: center;
        background-color: #090411;
        position: relative;
        left:-10px;
        width:calc(100% + 18px);
        padding-top:5px;
        height:30px;
        margin-top: 10px;
        margin-bottom: 10px;
        
    }
    .launch{
        padding:20px;
        height:150px
    }
    .launcher{
        text-align: center;
        padding: 40px;
    }
    .center{

        display: flex;
        align-items: center;
        justify-content: center;
    }
    .fit{
        max-width: 600px;
        width:100%;
    }
</style>
<!-- <h1 id="h">HARDHAT</h1> -->
 <header>
    <img class="title" src="./assets/titlelogo2.png">
    <h3>The HAT Installer</h3>

 </header>
<div>
    <h1 id="logstat">idle</h1>
    <button id="logs">show logs</button>
    <p id="log" class="log hidden">[empty]</p>
    
</div>
<div class="nav">
    <button id="installation" class="active">installation</button>
    <button id="mods">mods</button>
    <button id="launch">launch</button>
</div>
<div class = "installer" id="pagein">
    <div class="center">
        <div class="fit">
            <label for="FEZ PATH">FEZ Game Path:<br></label>
            <input class="textin" id="path" type="text" name="FEZ PATH" value="Auto Detect">

            <select id="versions">
                <option value="/new">Latest</option>
            </select>
            <div id="depricated" class="hidden">
                <h2 class="warn">WARNING: Pre 2.0 builds are Depricated</h2>
                <p class="warn"> some mods don't support newer builds, but depricated builds are experimental in this installer</p>
                <!-- <label for="sos">SteamOS: </label>
                <input type="checkbox" name="sos" value=false>       -->
            </div>

            <div id="unsupported" class="hidden">
                <h2 class="error">PRE 2.0 BUILDS UNSUPPORTED CURRENTLY</h2>
            </div><br><br>
            <h1 id="confirm" class="hidden" style="color:#aae1aa">HAT Already Installed</h1>
            <button id="exec" class="final hidden">Install!</button>
            
        </div>

    </div>

</div>
<div class = "launcher hidden" id="pagela">
    <button class="launch" id="FEZ">
        <img class="" src="./assets/FEZ.png"><p>unmodified game</p>
    </button>
    <button class="launch" id="HAT">
        <img class="" src="./assets/HAT.png"><p>play with mods</p>
    </button>
</div>
<div class = "mods hidden" id="pagemo">
    <h1 class="warn" id="nins">HAT Not Installed</h1>
    <div id="modpage" class="hidden">
        <div class="flex space">
            <div>
                <button id="modman">Manage</button>
                <button id="moddown" class="active">Download</button>
            </div>
            <button id="modrefresh">Refresh</button>
        </div>
        <div class="flex wrap hidden" id="modflex"></div>
        <div class="hidden" id="modmanage">
        </div>
    </div>
</div>

    <footer>
        <p>HARDHAT made by <a href="https://github.com/loglot">loglot</a></p>
    </footer>
</body>
<script src="./JS/version.js"></script><br>
<script src="./JS/mods.js"></script><br>
<script src="./JS/HAT.js"></script><br>
<script src="./JS/logs.js"></script><br>
<script src="./JS/navigation.js"></script><br>
<script src="./JS/handle.js"></script><br>
